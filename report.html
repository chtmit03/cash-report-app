<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <title>Audit Report</title>
    <style>
      body{
        margin:0;
        padding:24px;
        background:#f4f6f9;
        font-family: Arial, sans-serif;
        color:#222;
      }
      .report-wrap{
        max-width:1100px;
        margin:0 auto;
      }
      .topbar{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:20px;
        gap:12px;
        flex-wrap:wrap;
      }
      .title{
        font-size:28px;
        font-weight:700;
        color:#123b67;
      }
      .btn{
        border:none;
        background:#123b67;
        color:#fff;
        padding:10px 16px;
        border-radius:10px;
        cursor:pointer;
        font-size:14px;
      }
      .btn:hover{
        opacity:.92;
      }
      .card{
        background:#fff;
        border-radius:16px;
        box-shadow:0 2px 10px rgba(0,0,0,.08);
        padding:18px;
        margin-bottom:18px;
      }
      .section-title{
        font-size:18px;
        font-weight:700;
        color:#123b67;
        margin-bottom:14px;
      }
      .grid{
        display:grid;
        grid-template-columns:repeat(3, 1fr);
        gap:12px;
      }
      .field{
        border:1px solid #e3e7ee;
        border-radius:12px;
        padding:12px;
        background:#fafbfc;
      }
      .label{
        font-size:12px;
        color:#666;
        margin-bottom:6px;
      }
      .value{
        font-size:16px;
        font-weight:600;
        word-break:break-word;
      }
      .table-wrap{
        overflow:auto;
      }
      table{
        width:100%;
        border-collapse:collapse;
      }
      th, td{
        border:1px solid #d9e1ea;
        padding:10px;
        text-align:left;
        font-size:14px;
      }
      th{
        background:#123b67;
        color:#fff;
      }
      .badge{
        display:inline-block;
        padding:6px 10px;
        border-radius:999px;
        font-size:13px;
        font-weight:700;
      }
      .ok{
        background:#e8f7ec;
        color:#1f7a37;
      }
      .warn{
        background:#fff3cd;
        color:#8a6d3b;
      }
      .bad{
        background:#fdeaea;
        color:#b42318;
      }
      .muted{
        color:#777;
        font-size:13px;
      }

      @media (max-width: 768px){
        .grid{
          grid-template-columns:1fr;
        }
      }

      @media print{
        body{
          background:#fff;
          padding:0;
        }
        .topbar{
          display:none;
        }
        .card{
          box-shadow:none;
          border:1px solid #ddd;
          break-inside:avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="report-wrap">
      <div class="topbar">
        <div class="title">Audit Report</div>
        <div>
          <button class="btn" onclick="window.print()">พิมพ์ / Save PDF</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">ข้อมูลทั่วไป</div>
        <div class="grid">
          <div class="field">
            <div class="label">แถวข้อมูล</div>
            <div class="value" id="rowNumber">-</div>
          </div>
          <div class="field">
            <div class="label">สาขา / สำนักงาน</div>
            <div class="value" id="branchName">-</div>
          </div>
          <div class="field">
            <div class="label">วันที่ตรวจสอบ</div>
            <div class="value" id="auditDate">-</div>
          </div>
          <div class="field">
            <div class="label">ผู้ตรวจสอบ</div>
            <div class="value" id="auditor">-</div>
          </div>
          <div class="field">
            <div class="label">สถานะเงินสด</div>
            <div class="value" id="statusBadge">-</div>
          </div>
          <div class="field">
            <div class="label">Diff Amount</div>
            <div class="value" id="diffAmount">-</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">สรุปยอด</div>
        <div class="grid">
          <div class="field">
            <div class="label">ยอดยกมา</div>
            <div class="value" id="startBal">-</div>
          </div>
          <div class="field">
            <div class="label">รับเข้า</div>
            <div class="value" id="receiveBal">-</div>
          </div>
          <div class="field">
            <div class="label">จ่ายออก</div>
            <div class="value" id="payBal">-</div>
          </div>
          <div class="field">
            <div class="label">ปรับปรุง</div>
            <div class="value" id="adjustBal">-</div>
          </div>
          <div class="field">
            <div class="label">คงเหลือ</div>
            <div class="value" id="leftSum">-</div>
          </div>
          <div class="field">
            <div class="label">ยอดเงินจริง</div>
            <div class="value" id="rightTotal">-</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">รายละเอียดเพิ่มเติม</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>หัวข้อ</th>
                <th>ค่า</th>
              </tr>
            </thead>
            <tbody id="detailTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const rowFromServer = '<?= row ?>';

      function formatValue(val) {
        if (val === null || val === undefined || val === '') return '-';
        return val;
      }

      function formatNumber(val) {
        if (val === null || val === undefined || val === '') return '-';
        const num = Number(String(val).toString().replace(/,/g, ''));
        if (isNaN(num)) return val;
        return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function renderStatus(text) {
        const el = document.getElementById('statusBadge');
        const value = String(text || '-');

        let cls = 'badge warn';
        if (value.includes('ตรง')) cls = 'badge ok';
        if (value.includes('ขาด') || value.includes('เกิน')) cls = 'badge bad';

        el.innerHTML = '<span class="' + cls + '">' + value + '</span>';
      }

      function setText(id, value) {
        document.getElementById(id).textContent = formatValue(value);
      }

      function buildDetailsTable(data) {
        const tbody = document.getElementById('detailTable');
        tbody.innerHTML = '';

        Object.keys(data).forEach(key => {
          if ([
            '_rowNumber',
            'branchName',
            'branch',
            'date',
            'audit_date',
            'auditDate',
            'auditor',
            'auditorName',
            'status_badge',
            'diff_amount',
            'start_bal',
            'receive_bal',
            'pay_bal',
            'adjust_bal',
            'left_sum',
            'right_total'
          ].includes(key)) return;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${key}</td>
            <td>${formatValue(data[key])}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      function renderData(data) {
        setText('rowNumber', data._rowNumber || rowFromServer || '-');
        setText('branchName', data.branchName || data.branch || '-');
        setText('auditDate', data.auditDate || data.audit_date || data.date || '-');
        setText('auditor', data.auditorName || data.auditor || '-');

        renderStatus(data.status_badge || '-');

        document.getElementById('diffAmount').textContent = formatNumber(data.diff_amount);
        document.getElementById('startBal').textContent = formatNumber(data.start_bal);
        document.getElementById('receiveBal').textContent = formatNumber(data.receive_bal);
        document.getElementById('payBal').textContent = formatNumber(data.pay_bal);
        document.getElementById('adjustBal').textContent = formatNumber(data.adjust_bal);
        document.getElementById('leftSum').textContent = formatNumber(data.left_sum);
        document.getElementById('rightTotal').textContent = formatNumber(data.right_total);

        buildDetailsTable(data);
      }

      function loadReport() {
        const autoPrint = new URLSearchParams(window.location.search).get('print') === '1';

        const done = function(data) {
          if (rowFromServer) data._rowNumber = rowFromServer;
          renderData(data);

          if (autoPrint) {
            setTimeout(() => {
              window.print();
            }, 700);
          }
        };

        if (rowFromServer) {
          google.script.run
            .withSuccessHandler(done)
            .withFailureHandler(function(err) {
              alert('โหลดข้อมูลไม่สำเร็จ: ' + err.message);
            })
            .getAuditReportData(rowFromServer);
        } else {
          google.script.run
            .withSuccessHandler(done)
            .withFailureHandler(function(err) {
              alert('โหลดข้อมูลไม่สำเร็จ: ' + err.message);
            })
            .getLatestAuditReportData();
        }
      }

      loadReport();
    </script>
  </body>
</html>
